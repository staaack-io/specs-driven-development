name: Demande de fonctionnalité ou de skill
description: Proposer un nouveau skill, agent, modèle ou changement de méthodologie.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type de changement
      options:
        - Nouveau skill
        - Nouveau skill de workflow
        - Nouveau modèle ou nouvelle section
        - Changement de méthodologie, phases ou contrats de sortie
        - Changement du harness ou d’un hook
        - Autre
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problème
      description: Qu'est-ce qui manque ou pose problème aujourd'hui ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Solutions envisagées
  - type: checkboxes
    id: skill_isolation
    attributes:
      label: Isolation du skill Codex
      description: Confirmer qu'un nouveau skill reste séparé des autres.
      options:
        - label: Je le conserverai dans son propre dossier `.agents/skills/<name>/`
        - label: N/A, documentation, CI ou exemple uniquement

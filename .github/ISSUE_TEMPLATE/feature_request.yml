name: Feature / skill request
description: Propose a new skill, agent, template section, or methodology change.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New skill
        - New workflow skill
        - New template / template section
        - Methodology change (phases, exit contracts)
        - Harness / hook change
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: skill_isolation
    attributes:
      label: Codex skill isolation
      description: Confirm that a new skill remains a separate Codex skill.
      options:
        - label: I will keep it under its own `.agents/skills/<name>/` directory
        - label: N/A (docs / CI / example only)

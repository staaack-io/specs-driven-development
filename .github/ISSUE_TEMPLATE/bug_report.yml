name: Rapport de bug
description: Un élément du framework (skill, prompt, hook, harness ou modèle) est cassé ou incorrect.
labels: [bug]
body:
  - type: input
    id: platform
    attributes:
      label: Plateforme
      description: Quelle interface Codex utilisez-vous ?
      placeholder: Application Codex | CLI | extension IDE | cloud | N/A (documentation)
    validations:
      required: true
  - type: input
    id: asset
    attributes:
      label: Fichiers concernés
      description: Chemins dans le dépôt, par exemple `.codex/hooks/block-impl-without-failing-test.sh`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Exécuter `$spec ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environnement
      placeholder: |
        - OS:
        - Interface Codex et version :
        - Versions de jq / bash / Java / Maven, si pertinent :

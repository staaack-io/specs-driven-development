name: Hermes CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-tests:
    name: Hermes tests and skill contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned CI dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run every Hermes Python test
        run: python3 hermes/scripts/run_python_tests.py

      - name: Validate embedded Hermes skills
        run: python3 hermes/scripts/validate_skills.py hermes/skills

  documentation:
    name: Documentation and diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Validate changed documentation and diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/validate-changed-docs.sh \
            "$EVENT_NAME" "$PR_BASE_SHA" "$BEFORE_SHA" "$HEAD_SHA"
